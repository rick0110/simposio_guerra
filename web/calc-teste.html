<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste da Mesa de Cálculo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="desk" style="min-height:100vh;margin:0;padding:28px 24px 80px;">
  <main style="max-width:820px;">
    <h1 class="stencil">Teste · Mesa de Cálculo</h1>
    <p class="typed">Cada botão abre a gaveta na ferramenta e preenche os campos com dados reais dos dossiês em <code>web/mock/</code>. A execução é feita pelo usuário (Enter ou botão).</p>
    <div class="row" id="btns" style="flex-wrap:wrap;gap:10px;margin:18px 0;"></div>
    <p class="typed faint" id="status">carregando dossiês…</p>
  </main>

  <div id="calc-drawer"></div>

  <script type="module">
    import { mountCalc } from "./js/calc.js";

    const calc = mountCalc(document.getElementById("calc-drawer"));
    window.calc = calc;

    const load = (s) => fetch(`mock/dossier_${s}.json`, { cache: "no-store" }).then((r) => r.json());
    const dsOf = (d, id) => d.datasets.find((x) => x.id === id);
    const num = (v) => (typeof v === "number" ? v : Number(String(v).replace(",", ".")));

    async function buildPrefills() {
      const [intd, oper, inte, gov] = await Promise.all(
        ["intendencia", "operacoes", "inteligencia", "governo"].map(load));
      const P = {};

      // Intendência → Leontief: Z (3×3) e X são as linhas do dataset "transacoes" (última linha = X)
      const tr = dsOf(intd, "transacoes").rows;
      const mo = dsOf(intd, "mao_de_obra").rows;
      P.leontief = {
        Z: tr.slice(0, 3).map((r) => r.slice(1)),
        X: tr[3].slice(1),
        L: mo.slice(0, 3).map((r) => r[1]),
        d: [20, 4, 6], // desafio c2-intendencia
      };

      // Operações → Markov: sequência do diário da região Centro (coluna 2) e estado atual
      const dia = dsOf(oper, "diario_clima").rows;
      P.markov = { sequence: dia.map((r) => r[2]), state: "chuva", k: 1 };
      P.lanchester = { A0: 100, B0: 80, alpha: 0.6, beta: 0.5, T: 0.9 };

      // Inteligência → Hill: primeiro comunicado interceptado, crib "URGENTE "
      const inter = inte.extras.intercepts[0];
      P.hill = { cipher: inter.cipher, crib: inte.extras.crib, key: [[8, 19], [34, 28]] };

      // Inteligência → Triangulação: leituras das estações (Estação, x, y, distância)
      const lei = dsOf(inte, "leituras").rows;
      P.trilaterate = {
        stations: lei.map((r) => [num(r[1]), num(r[2])]),
        distances: lei.map((r) => num(r[3])),
      };

      // Governo → Regressão: pesquisa de opinião (25 observações)
      const pes = dsOf(gov, "pesquisa");
      P.regression = {
        rows: pes.rows.map((r) => Object.fromEntries(pes.columns.map((c, j) => [c, r[j]]))),
        target: "delta_moral",
        features: gov.extras.features,
      };

      P.matrix = { A: [[2, 1], [1, 3]], b: [1, 2] };
      return P;
    }

    const TOOLS = ["matrix", "hill", "leontief", "markov", "trilaterate", "regression", "lanchester"];
    buildPrefills().then((P) => {
      window.PREFILL = P;
      const box = document.getElementById("btns");
      for (const t of TOOLS) {
        const b = document.createElement("button");
        b.className = "btn btn--small";
        b.type = "button";
        b.dataset.tool = t;
        b.textContent = `abrir: ${t}`;
        b.addEventListener("click", () => calc.open(t, P[t]));
        box.append(b);
      }
      const e = document.createElement("button");
      e.className = "btn btn--small";
      e.type = "button";
      e.id = "open-empty";
      e.textContent = "abrir vazio (sem dados)";
      e.addEventListener("click", () => calc.open());
      box.append(e);
      document.getElementById("status").textContent = "dossiês carregados; use os botões.";
      window.PREFILL_READY = true;
    }).catch((err) => {
      document.getElementById("status").textContent = "erro ao carregar dossiês: " + err.message;
    });
  </script>
</body>
</html>
